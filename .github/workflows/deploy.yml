name: Deploy Static Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh OAA Data"]
    types:
      - completed
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "deploy-static-site"
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run tests
        run: go test ./...

  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Download latest database from storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
        run: go run ./cmd/fetch -from-storage
      - name: Build static site
        run: go run ./cmd/build -database data/oaamonitor.db -out public
      - name: Deploy to Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: oaamonitor-benbailey-me-site
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_REGION: ${{ vars.BUNNY_STORAGE_S3_REGION }}
          BUNNY_STORAGE_S3_ENDPOINT: ${{ vars.BUNNY_STORAGE_S3_ENDPOINT }}
        run: >-
          aws s3 sync public/
          s3://oaamonitor-benbailey-me-site/
          --endpoint-url "$BUNNY_STORAGE_S3_ENDPOINT"
          --delete
          --no-progress
