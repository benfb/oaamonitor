name: Deploy Static Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh OAA Data"]
    types:
      - completed
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "deploy-static-site"
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run tests
        run: go test ./...

  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Download latest database from Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: oaamonitor-benbailey-me-site
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_REGION: NY
          AWS_ENDPOINT_URL_S3: https://ny-s3.storage.bunnycdn.com
          DATABASE_STORAGE_BUCKET: oaamonitor-benbailey-me-site
          DATABASE_STORAGE_KEY: downloads/oaamonitor.db
        run: go run ./cmd/fetch -from-storage
      - name: Build static site
        run: go run ./cmd/build -database data/oaamonitor.db -out public
      - name: Deploy to Bunny Storage
        env:
          AWS_ACCESS_KEY_ID: oaamonitor-benbailey-me-site
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_REGION: NY
        # The database and its backups live in the same zone as the site. Excluded
        # paths are never deleted by --delete, so they must stay listed here.
        run: >-
          aws s3 sync public/
          s3://oaamonitor-benbailey-me-site/
          --endpoint-url https://ny-s3.storage.bunnycdn.com
          --delete
          --exclude "downloads/*"
          --exclude "backups/*"
          --no-progress
      - name: Purge Bunny CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
        run: |
          : "${BUNNY_API_KEY:?Set the BUNNY_API_KEY repository secret}"
          : "${BUNNY_PULL_ZONE_ID:?Set the BUNNY_PULL_ZONE_ID repository variable}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "AccessKey: $BUNNY_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://api.bunny.net/pullzone/$BUNNY_PULL_ZONE_ID/purgeCache"
