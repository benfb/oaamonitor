{{ define "header" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.js"
        integrity="sha384-hfkuqrKeWFmnTMWN31VWyoe8xgdTADD11kgxmdpx2uyE6j5Az5uZq6u6AKYYmAOw"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"
        integrity="sha384-yzVjVsgM1C687v6dWwBp9XurYpqEHWfk39FYLcmjZkbneJ2hefxMNuv73FZOxcNx"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"
        integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzbUUiBGLsIQUE+b1mxws"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"
        integrity="sha384-y49Zu59jZHJL/PLKgZPv3k2WI9c0Yp3pWB76V8OBVCb0QBKS8l4Ff3YslzHVX76Y"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/static/chartHelpers.js"></script>
</head>

<body>
    <nav>
        <ul>
            <li class="nav-logo"><a href="/"><span class="logo-accent">OAA</span>Monitor</a></li>
            <li class="dropdown">
                <span class="nav-teams">Teams <span class="arrow"></span></span>
                <ul class="dropdown-content">
                    {{ range .Teams }}
                    <li><a href="/team/{{ .Slug }}">{{ .Name }}</a></li>
                    {{ end }}
                </ul>
            </li>
            <li class="nav-search">
                <input type="text" id="nav-player-search" placeholder="Search players…" oninput="liveSearch()">
                <div id="search-results" style="display:none;"></div>
            </li>
        </ul>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dropdown = document.querySelector('.dropdown');

            dropdown.addEventListener('click', function (event) {
                event.stopPropagation();
                dropdown.classList.toggle('open');
            });

            document.addEventListener('click', function () {
                dropdown.classList.remove('open');
            });
        });
    </script>
    <main class="page-content">
{{ end }}
